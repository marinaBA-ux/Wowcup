name: Test automatic schedule

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Show scheduled run time
        run: |
          echo "Automatic schedule is working!"
          echo "Current time: $(date -u)"
          echo "Trigger: ${{ github.event_name }}"
